[project]
name = "cad-models"
version = "0.1.0"
description = "Parametric 3D CAD models using build123d"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.10.0",
    "ocp-vscode>=2.6.0",
    "ruff>=0.15.10",
]

[project.optional-dependencies]
dev = [
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # aligned comments in param files exceed 100 chars by design
    "E402",  # sys.path.insert() before imports is required in multi-project files
]
